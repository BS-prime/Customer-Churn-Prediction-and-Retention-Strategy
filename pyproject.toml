[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-prediction-and-retention-strategy"
version = "0.1.0"
description = "Predict customer churn and rentension profit"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "category-encoders>=2.9.0",
    "dill>=0.4.1",
    "fastapi>=0.136.1",
    "fastparquet>=2026.3.0",
    "ipykernel>=7.2.0",
    "joblib>=1.5.3",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0,<3.0.0",
    "pandas-stubs~=2.3.3",
    "patsy>=1.0.2",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.3",
    "pyrefly>=0.60.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy-stubs~=1.17.1",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
    "uvicorn[standard]>=0.46.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]

where = ["."]
include = ["src*"]
