data:
  path: "data/raw/Telco_customer_churn.xlsx"
  test_size: 0.2
  random_state: 42

models:

  LogisticRegression:
    type: "LogisticRegression"
    params:
      penalty: [ "l2" ]                         # Standard regularization to prevent overfitting
      C: [ 1.0 ]                               # Inverse of regularization strength; 1.0 is a good default
      solver: [ "lbfgs" ]                      # Efficient for small datasets and supports L2 penalty
      max_iter: [ 1000 ]                      # Ensure convergence, especially with imbalanced data


  RandomForest: # This will be used in model naming after training.
    type: "RandomForestClassifier"
    params:
      n_estimators: [ 500, 1000, 1500 ]                     # More trees help identify rare minority patterns
      max_depth: [ 10, 15 ]                                 # Prevents memorizing noise in majority data
      min_samples_leaf: [ 10 ]                              # Ensures leaves are statistically significant, reducing false positives
      max_features: [ "sqrt", "log2" ]                      # Standard for diverse trees in ensemble
      bootstrap: [ true ]
      n_jobs: [ -1 ]                                        # Use all available CPU cores for speed


  xgboost:
    type: "XGBClassifier"
    params:
      scale_pos_weight: [ 73.4 ]
      max_depth: [ 3, 6 ]                     # Shallow trees are more robust for rare events
      min_child_weight: [ 10, 15, 20 ]                # Higher values prevent splitting on single churn cases
      gamma: [ 1.5 ]                          # Minimum loss reduction to split; adds conservatism
      lambda: [ 1.0, 2.0 ]                         # L2 regularization to keep leaf weights stable
      alpha: [ 0.5 ]                          # L1 regularization for feature sparsity
      subsample: [ 0.6, 0.8 ]                      # Rows sampled per tree to increase robustness
      colsample_bytree: [ 0.8 ]               # Features sampled per tree
      learning_rate: [ 0.01 ]                 # Low rate + more estimators is better for fraud
      n_estimators: [ 500, 1000, 1500 ]       # More trees to capture complex patterns
      tree_method: [ "hist" ]

training:
  random_state: 42

output:
  train_feature_path: artifacts/features/train.csv
  test_feature_path: artifacts/features/test.csv
  preprocessor_path: artifacts/preprocessor/preprocessor.pkl
  model_path: models/best_model.pkl
  metrics_path: artifacts/metrics/metrics.json